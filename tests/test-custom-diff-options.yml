name: Test custom git-diff-options input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          git-diff-options: '--ignore-all-space --ignore-blank-lines'

      - name: Assert action failed for non-PR event (not due to bad inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action checks for pull_request event first, before using git-diff-options.
          # So even with valid custom diff options, it should fail on the event check.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when triggered outside of a pull_request event, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for non-pull_request event even with custom git-diff-options"
