name: Test pull request event detection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake pull_request event payload
        run: |
          mkdir -p /tmp/sizeup-test
          cat > /tmp/sizeup-test/event.json <<'EOF'
          {
            "action": "opened",
            "number": 1,
            "pull_request": {
              "number": 1,
              "draft": false,
              "user": {
                "login": "test-user"
              },
              "head": {
                "ref": "feature-branch",
                "sha": "abc123"
              },
              "base": {
                "ref": "main",
                "sha": "def456",
                "repo": {
                  "name": "test-repo",
                  "full_name": "test-owner/test-repo",
                  "owner": {
                    "login": "test-owner"
                  }
                }
              }
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/sizeup-test/event.json" >> $GITHUB_ENV

      - name: Run sizeup action on pull_request event (will fail at clone, not at event check)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing

      - name: Assert action did not fail due to wrong event type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (because the token is fake and clone will fail),
          # but it should NOT fail with the "only supported on pull_request event" message.
          # We verify the action at least got past the event check by confirming
          # the failure is not "success" (it should fail at clone) and the
          # event detection worked correctly.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at a later step (past event check), as expected with fake token"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
