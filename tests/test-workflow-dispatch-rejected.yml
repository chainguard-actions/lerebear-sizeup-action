name: Test workflow_dispatch event is rejected
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run sizeup action on workflow_dispatch event (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-dispatch-test

      - name: Assert action failed for workflow_dispatch event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when triggered by a workflow_dispatch event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected workflow_dispatch event"
