name: Test non-PR event error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action only supports pull_request events. Under act (workflow_dispatch),
      # it should call core.setFailed() with a descriptive error message.
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}

      - name: Assert action failed with non-PR event error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when triggered outside of pull_request event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when triggered outside of pull_request event"
