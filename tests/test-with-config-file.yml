name: Test with configuration file path
# This action is only supported on pull_request events.
# Under act (workflow_dispatch), it should fail with a clear error message
# regardless of whether a configuration file is provided.
# This test verifies the action handles the configuration-file-path input
# and still enforces the pull_request event requirement.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a custom sizeup configuration file
        run: |
          cat > /tmp/sizeup-config.yaml << 'EOF'
          categories:
            - name: tiny
              lte: 5
              label:
                name: tiny
                description: Tiny change
                color: 00ff00
            - name: normal
              label:
                name: normal
                description: Normal change
                color: ffff00
          EOF

      - id: action
        name: Run sizeup action with config file (expect failure)
        uses: .
        with:
          token: ${{ github.token }}
          configuration-file-path: /tmp/sizeup-config.yaml
        continue-on-error: true

      - name: Assert action failed due to non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when triggered outside pull_request event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when triggered outside pull_request event (even with config file)"
