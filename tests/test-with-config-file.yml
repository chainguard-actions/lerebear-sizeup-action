name: Test with configuration-file-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sizeup configuration file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/sizeup-config.yaml" <<'EOF'
          sizeup:
            thresholds:
              - name: small
                lte: 100
              - name: medium
                lte: 500
              - name: large
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          configuration-file-path: tests/fixtures/sizeup-config.yaml

      - name: Assert action failed for non-PR event (not due to bad config)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action checks for pull_request event first, before reading the config file.
          # So even with a valid config file, it should fail on the event check.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when triggered outside of a pull_request event, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for non-pull_request event even with configuration-file-path provided"
