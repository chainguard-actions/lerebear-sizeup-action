name: Test wrong event rejection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run sizeup action on push event (should fail)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: push
        with:
          token: fake-token

      - name: Assert action failed for wrong event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when triggered by push event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected non-pull_request event"
