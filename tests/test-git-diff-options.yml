name: Test git-diff-options input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run sizeup action with custom git-diff-options (expect failure on non-PR event)
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          git-diff-options: '--ignore-space-change --ignore-blank-lines'

      - name: Assert action failed due to wrong event (not input error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when triggered by non-pull_request event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for non-pull_request event with custom git-diff-options"
