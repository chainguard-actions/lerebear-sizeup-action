name: Test PR event with invalid token fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake pull_request event payload
        run: |
          cat > /tmp/pr-event.json << 'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 1,
              "draft": false,
              "head": {
                "ref": "feature-branch",
                "sha": "abc1234"
              },
              "base": {
                "ref": "main",
                "repo": {
                  "full_name": "test-owner/test-repo",
                  "name": "test-repo",
                  "owner": {
                    "login": "test-owner"
                  }
                }
              },
              "user": {
                "login": "test-user"
              }
            }
          }
          EOF

      - name: Run action with pull_request event context and invalid token
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_REF: refs/pull/1/merge
          GITHUB_HEAD_REF: feature-branch
          GITHUB_BASE_REF: main
          GITHUB_EVENT_PATH: /tmp/pr-event.json
        with:
          token: invalid-token-that-will-fail-auth

      - name: Assert action failed (expected due to invalid token / clone failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid token"
