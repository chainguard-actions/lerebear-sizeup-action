name: Test custom configuration file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create pull_request event payload
        run: |
          mkdir -p /tmp/event
          cat > /tmp/event/event.json <<'EOF'
          {
            "pull_request": {
              "number": 42,
              "draft": false,
              "user": { "login": "contributor" },
              "head": {
                "ref": "my-feature",
                "sha": "aabbcc"
              },
              "base": {
                "ref": "main",
                "sha": "ddeeff",
                "repo": {
                  "full_name": "myorg/myrepo",
                  "name": "myrepo",
                  "owner": { "login": "myorg" }
                }
              }
            }
          }
          EOF

      - name: Create custom sizeup configuration file
        run: |
          mkdir -p /tmp/sizeup-config
          cat > /tmp/sizeup-config/sizeup.yaml <<'EOF'
          labeling:
            applyCategoryLabels: false
            categoryLabelPrefix: "size/"
          commenting:
            addCommentWhenScoreThresholdHasBeenExceeded: false
          sizeup:
            categories:
              - name: extra small
                lte: 10
              - name: small
                lte: 30
              - name: medium
                lte: 100
              - name: large
                lte: 500
              - name: extra large
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: /tmp/event/event.json
        with:
          token: fake-token-for-testing
          git-diff-options: '--ignore-space-change --ignore-blank-lines'
          configuration-file-path: /tmp/sizeup-config/sizeup.yaml

      - name: Assert action attempted PR processing with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the clone step (fake token),
          # but it must NOT fail with the "only supported on pull_request event" message.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at clone step (fake token), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action accepted custom configuration and attempted PR processing"
