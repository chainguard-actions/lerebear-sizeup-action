name: Test non-PR event rejection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action on push event (should fail)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: push
        with:
          token: fake-token

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when triggered by a non-pull_request event"
            exit 1
          fi
          echo "PASS: action correctly failed for non-pull_request event"
