name: Test basic PR event handling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal pull_request event payload so the action can read
      # github.context.payload.pull_request. The action will fail when it
      # tries to clone with a fake token, but it should NOT fail with the
      # "only supported on pull_request event" message.
      - name: Create pull_request event payload
        run: |
          mkdir -p /tmp/event
          cat > /tmp/event/event.json <<'EOF'
          {
            "pull_request": {
              "number": 1,
              "draft": false,
              "user": { "login": "test-user" },
              "head": {
                "ref": "feature-branch",
                "sha": "abc123"
              },
              "base": {
                "ref": "main",
                "sha": "def456",
                "repo": {
                  "full_name": "test-owner/test-repo",
                  "name": "test-repo",
                  "owner": { "login": "test-owner" }
                }
              }
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: /tmp/event/event.json
        with:
          token: fake-token-for-testing

      - name: Assert action attempted PR processing (not rejected as wrong event)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (because the token is fake and clone will fail),
          # but it must NOT fail with the "only supported on pull_request event" message.
          # We verify it failed (meaning it got past the event check and tried to do work).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at clone step (fake token), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action attempted PR processing as expected (failed at clone with fake token)"
