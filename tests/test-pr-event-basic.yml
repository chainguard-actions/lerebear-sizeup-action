name: Test pull_request event proceeds past event check
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake pull_request event payload
        run: |
          cat > /tmp/pr_event.json << 'EOF'
          {
            "action": "opened",
            "number": 1,
            "pull_request": {
              "number": 1,
              "title": "Test PR",
              "draft": false,
              "user": {
                "login": "test-user"
              },
              "base": {
                "ref": "main",
                "repo": {
                  "full_name": "test-owner/test-repo",
                  "name": "test-repo",
                  "owner": {
                    "login": "test-owner"
                  }
                }
              },
              "head": {
                "ref": "feature-branch",
                "sha": "abc123"
              }
            },
            "repository": {
              "full_name": "test-owner/test-repo",
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/pr_event.json" >> "$GITHUB_ENV"

      - name: Run action on pull_request event (fails at clone with fake token, not at event check)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
        with:
          token: fake-token-for-testing

      - name: Assert action failed (expected - fake token causes clone failure)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because the fake token can't clone the repo.
          # This is expected and confirms the action correctly passed the pull_request
          # event check and proceeded to the clone step.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail at clone step with fake token"
            exit 1
          fi
          echo "PASS: action correctly processed pull_request event and failed at clone (not event check)"
