name: Test non-PR event rejection
# This action is only supported on pull_request events.
# Under act (workflow_dispatch), it should fail with a clear error message.
# This test verifies that guard logic works correctly.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run sizeup action (expect failure)
        uses: .
        with:
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed due to non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when triggered outside pull_request event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when triggered outside pull_request event"
