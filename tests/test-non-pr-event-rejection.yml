name: Test non-PR event rejection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The action sets a failure exit code when not triggered by pull_request,
    # so we use continue-on-error to capture the outcome and assert on it.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: push
        with:
          token: fake-token

      - name: Assert action failed due to non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when triggered on a non-pull_request event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected non-pull_request event"
