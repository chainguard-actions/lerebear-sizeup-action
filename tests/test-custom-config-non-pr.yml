name: Test custom configuration file on non-PR event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Write a minimal sizeup configuration file for testing
      - name: Create custom sizeup config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/sizeup-config.yaml" <<'EOF'
          categories:
            - name: extra small
              lte: 10
            - name: small
              lte: 30
            - name: medium
              lte: 100
            - name: large
              lte: 500
            - name: extra large
          EOF

      # The action only supports pull_request events. Even with a custom config,
      # it should fail with the non-PR event error before reading the config.
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          configuration-file-path: tests/fixtures/sizeup-config.yaml
          git-diff-options: '--ignore-space-change --ignore-blank-lines'

      - name: Assert action failed due to non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when triggered outside of pull_request event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when triggered outside of pull_request event (even with custom config)"
